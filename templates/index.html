<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫画管理</title>
</head>

<body>

<h1>◆ 漫画追加</h1>

<form action="/add" method="post">

<p>
作品名<br>
<input type="text" name="title" required>
</p>

<p>
サイト名<br>
<input type="text" name="site" required>
</p>

<p>
URL<br>
<input type="url" name="url" required>
</p>

<button type="submit">
追加する
</button>

</form>


<hr>


<h1>◆ 登録済み漫画</h1>

{% for manga in mangas %}

<div>
<p>
<strong>{{ manga.title }}</strong><br>
{{ manga.site }}<br>
<a href="{{ manga.url }}" target="_blank">
{{ manga.url }}
</a>
</p>

<form action="/delete" method="post">
<input type="hidden" name="url" value="{{ manga.url }}">
<button type="submit">
削除
</button>
</form>

<hr>

</div>

{% endfor %}


</body>
</html>
